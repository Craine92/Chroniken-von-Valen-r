name: Windows Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build game and server
        run: npm run build
      - name: Package Windows installers
        run: npm run dist:win
      - name: Verify packaged server dependencies
        shell: pwsh
        run: |
          $root = "release/win-unpacked/resources/app/node_modules"
          foreach ($module in @("cors", "express", "socket.io")) {
            if (-not (Test-Path (Join-Path $root $module))) {
              throw "Missing server module in Windows package: $module"
            }
          }
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Valenor-Windows
          path: release/*.exe
          if-no-files-found: error
